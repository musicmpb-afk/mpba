<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PLAY 12 • Boleros</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; -webkit-tap-highlight-color:transparent; }
  body { background:#0a0a0a; overflow:hidden; height:100vh; }
  :root { --cor: #00ff88; }
  .bg { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; opacity:0.3; }
  .app { position:relative; z-index:10; width:100%; height:100vh; display:flex; flex-direction:column; justify-content:space-between; }
  .top-bar { display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:rgba(0,0,0,0.6); backdrop-filter:blur(8px); border-bottom:2px solid var(--cor); gap:4px; flex-shrink:0; }
  .genre-badge { background:rgba(255,255,255,0.08); padding:3px 8px; border-radius:30px; font-size:0.55rem; font-weight:bold; color:#fff; border-left:2px solid var(--cor); display:flex; align-items:center; gap:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:30%; cursor:pointer; flex-shrink:1; min-width:40px; }
  .top-buttons { display:flex; gap:4px; align-items:center; flex-shrink:0; }
  .fav-top-btn { background:rgba(255,45,127,0.15); border:1px solid #ff2d7f; color:#ff2d7f; padding:2px 8px; border-radius:30px; font-size:0.5rem; cursor:pointer; display:flex; align-items:center; gap:3px; }
  .fav-top-btn:active { transform:scale(0.92); background:#ff2d7f; color:#000; }
  .fav-top-btn .badge { background:#ff2d7f; color:#000; border-radius:50%; padding:0 4px; font-size:0.45rem; font-weight:bold; min-width:14px; text-align:center; }
  .search-wrapper { position:relative; display:inline-block; flex-shrink:0; }
  .search-input { background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.2); border-radius:20px; padding:2px 8px; padding-right:20px; color:white; font-size:0.5rem; width:70px; transition:width 0.3s; }
  .search-input:focus { width:110px; outline:none; border-color:var(--cor); }
  .search-input::placeholder { color:#888; }
  .clear-search { position:absolute; right:4px; top:50%; transform:translateY(-50%); background:transparent; border:none; color:#888; cursor:pointer; font-size:0.5rem; display:none; padding:0 2px; }
  .audio-status { font-size:0.45rem; color:#aaa; display:flex; align-items:center; gap:3px; background:rgba(0,0,0,0.3); padding:1px 6px; border-radius:20px; border:1px solid rgba(255,255,255,0.1); }
  .audio-status.active { color:#4ade80; border-color:#4ade80; }
  .audio-status .dot { width:4px; height:4px; border-radius:50%; background:#666; display:inline-block; }
  .audio-status.active .dot { background:#4ade80; animation:pulse-dot 1s infinite; }
  @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .menu-button { background:rgba(255,255,255,0.05); color:white; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.7rem; cursor:pointer; border:1px solid rgba(255,255,255,0.2); }
  .menu-button:active { background:var(--cor); color:#000; }
  .menu-popup { position:absolute; top:42px; right:8px; background:rgba(0,0,0,0.95); backdrop-filter:blur(10px); border-radius:16px; padding:6px; z-index:32; display:none; flex-direction:column; gap:4px; border:1px solid var(--cor); min-width:150px; }
  .menu-popup.open { display:flex; }
  .menu-popup button { background:rgba(255,255,255,0.08); border:none; color:white; padding:5px 12px; border-radius:30px; font-size:0.6rem; display:flex; align-items:center; gap:6px; cursor:pointer; text-align:left; }
  .menu-popup button:active { background:var(--cor); color:#000; }
  .menu-popup .close-menu-btn { background:rgba(255,45,127,0.2); border:1px solid #ff2d7f; color:#ff2d7f; }
  .info-scroll { position:fixed; top:42px; left:0; right:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(8px); padding:6px 12px; z-index:30; border-bottom:1px solid rgba(255,255,255,0.05); overflow:hidden; white-space:nowrap; }
  .info-scroll p { color:white; font-size:0.85rem; font-weight:900; letter-spacing:2px; animation:scrollText 20s linear infinite; display:inline-block; padding-right:50px; text-shadow:0 0 30px rgba(0,0,0,0.8); text-transform:uppercase; }
  @keyframes scrollText { 0%{transform:translateX(100%)} 100%{transform:translateX(-100%)} }
  .now-playing { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; z-index:15; width:90%; max-width:400px; user-select:none; -webkit-user-select:none; }
  .now-playing .music-title { color:white; font-size:1.4rem; font-weight:700; text-shadow:0 0 30px rgba(0,0,0,0.9); margin-bottom:4px; }
  .now-playing .music-artist { color:#eee; font-size:1rem; font-weight:300; text-shadow:0 0 30px rgba(0,0,0,0.9); margin-bottom:8px; }
  .fav-heart-center { display:flex; justify-content:center; margin:10px 0; }
  .now-playing .fav-heart { font-size:3.5rem; color:#555; cursor:pointer; transition:all 0.3s; text-shadow:0 0 30px rgba(0,0,0,0.9); display:inline-block; }
  .now-playing .fav-heart.active { color:#ff2d7f; text-shadow:0 0 40px rgba(255,45,127,0.5); }
  .now-playing .fav-heart:active { transform:scale(1.2); }
  .equalizer { display:flex; gap:3px; justify-content:center; height:30px; margin-top:8px; align-items:flex-end; }
  .equalizer span { width:4px; background:linear-gradient(180deg,var(--cor),var(--cor)); border-radius:3px; animation:equalize 0.6s infinite alternate ease-in-out; }
  .equalizer span:nth-child(1){animation-delay:0s;height:10px} .equalizer span:nth-child(2){animation-delay:.1s;height:22px}
  .equalizer span:nth-child(3){animation-delay:.2s;height:14px} .equalizer span:nth-child(4){animation-delay:.3s;height:28px}
  .equalizer span:nth-child(5){animation-delay:.4s;height:18px} .equalizer span:nth-child(6){animation-delay:.5s;height:26px}
  .equalizer span:nth-child(7){animation-delay:.6s;height:12px} .equalizer span:nth-child(8){animation-delay:.7s;height:24px}
  .equalizer span:nth-child(9){animation-delay:.8s;height:16px} .equalizer span:nth-child(10){animation-delay:.9s;height:20px}
  @keyframes equalize { 0%{height:4px;opacity:.5} 100%{height:30px;opacity:1} }
  .equalizer.paused span { animation-play-state:paused; height:4px !important; opacity:.3 !important; }
  .teaching-bar { position:fixed; bottom:115px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.7); backdrop-filter:blur(12px); padding:6px 22px; border-radius:40px; font-size:0.6rem; font-weight:800; color:#ddd; z-index:26; pointer-events:none; border:1px solid rgba(255,255,255,0.05); white-space:nowrap; text-align:center; }
  .teaching-bar .cyan { color:var(--cor); font-weight:900; }
  .bottom-controls { position:fixed; bottom:0; left:0; right:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(20px); border-top:1px solid rgba(255,255,255,0.05); padding:6px 12px 10px; z-index:20; transform:translateY(100%); transition:transform 0.3s ease; }
  .bottom-controls.visible { transform:translateY(0); }
  .progress-time { display:flex; justify-content:space-between; font-size:0.5rem; color:#aaa; margin-bottom:2px; }
  .progress-bar { height:3px; background:rgba(255,255,255,0.15); cursor:pointer; border-radius:4px; overflow:hidden; }
  .progress-fill { height:100%; background:linear-gradient(90deg,var(--cor),var(--cor)); width:0%; border-radius:4px; }
  .buttons-row { display:flex; align-items:center; justify-content:center; gap:12px; margin-top:4px; }
  .ctrl-btn { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:#fff; font-size:0.8rem; width:34px; height:34px; border-radius:50%; cursor:pointer; }
  .ctrl-btn:active { transform:scale(0.92); background:var(--cor); color:#000; }
  .play-big { background:linear-gradient(135deg,var(--cor),var(--cor)); width:44px; height:44px; font-size:1.1rem; color:#000; border:none; }
  .shuffle-btn { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:#fff; font-size:0.7rem; width:34px; height:34px; border-radius:50%; cursor:pointer; }
  .shuffle-btn.active { background:var(--cor); color:#000; border-color:var(--cor); }
  .fab-container { position:fixed; bottom:100px; right:12px; z-index:40; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .fab-main { background:linear-gradient(135deg,#3a3a3a,#1a1a1a); width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:white; font-size:1.2rem; border:1px solid rgba(255,255,255,0.1); }
  .fab-main:active { transform:scale(0.92); }
  .fab-main i { pointer-events:none; }
  .fab-sub { background:rgba(0,0,0,0.9); backdrop-filter:blur(14px); border-radius:30px; padding:5px; display:none; flex-direction:column; gap:3px; border:1px solid rgba(255,255,255,0.1); }
  .fab-sub.open { display:flex; }
  .fab-sub-btn { background:rgba(255,255,255,0.05); border:none; color:white; padding:6px 14px; border-radius:25px; font-size:0.65rem; cursor:pointer; display:flex; align-items:center; gap:6px; white-space:nowrap; min-width:120px; }
  .fab-sub-btn:active { background:var(--cor); color:#000; }
  #splash { position:fixed; inset:0; background:#0a0a0a; display:flex; align-items:center; justify-content:center; z-index:9999; transition:opacity 0.5s; }
  #splash.hidden { opacity:0; pointer-events:none; }
  .splash-loading { text-align:center; color:white; }
  .splash-loading i { font-size:2rem; color:var(--cor); }
  .splash-loading p { margin-top:10px; font-size:0.85rem; }
  #tap-to-start { position:fixed; bottom:30%; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,#4ade80,#22c55e); color:#000; padding:14px 28px; border-radius:60px; font-weight:900; font-size:1.1rem; z-index:10000; cursor:pointer; display:none; animation:btnPulse 1.5s infinite; border:none; letter-spacing:1.5px; text-transform:uppercase; white-space:nowrap; }
  @keyframes btnPulse { 0%{transform:translateX(-50%) scale(1);opacity:.9} 50%{transform:translateX(-50%) scale(1.04);opacity:1} 100%{transform:translateX(-50%) scale(1);opacity:.9} }
  .notification { position:fixed; top:52px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.85); backdrop-filter:blur(10px); color:var(--cor); padding:3px 12px; border-radius:30px; font-size:0.55rem; z-index:10001; opacity:0; transition:opacity 0.3s; pointer-events:none; border-left:3px solid var(--cor); }
  .notification.show { opacity:1; }
  #loadingOverlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:9998; align-items:center; justify-content:center; }
  #loadingOverlay.active { display:flex; }
  #loadingOverlay i { font-size:3rem; color:var(--cor); animation:spin 1s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .fav-modal { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.9); background:rgba(20,20,40,0.95); backdrop-filter:blur(20px); border-radius:30px; padding:25px; z-index:5000; width:90%; max-width:380px; text-align:center; display:none; flex-direction:column; opacity:0; transition:all 0.3s ease; border:2px solid var(--cor); }
  .fav-modal.open { display:flex; opacity:1; transform:translate(-50%,-50%) scale(1); }
  .fav-modal h3 { font-size:1.2rem; margin-bottom:15px; color:var(--cor); }
  .fav-modal .close-fav { position:absolute; top:12px; right:16px; background:transparent; border:none; color:#888; font-size:1.5rem; cursor:pointer; }
  .fav-list { max-height:50vh; overflow-y:auto; text-align:left; margin-bottom:15px; }
  .fav-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.05); color:white; }
  .fav-item .info { flex:1; cursor:pointer; min-width:0; }
  .fav-item .info .title { font-weight:bold; font-size:0.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fav-item .info .artist { font-size:0.7rem; color:#aaa; }
  .fav-item .remove { background:transparent; border:none; color:#ff2d7f; font-size:1.1rem; cursor:pointer; padding:4px 8px; }
  .fav-empty { color:#888; padding:30px; text-align:center; }
  .fav-modal .close-btn { background:linear-gradient(135deg,var(--cor),var(--cor)); border:none; padding:12px; border-radius:30px; color:#000; font-weight:bold; cursor:pointer; font-size:0.95rem; }
  @media (max-width: 480px) {
    .now-playing .music-title{font-size:1.2rem} .now-playing .music-artist{font-size:.9rem} .now-playing .fav-heart{font-size:2.5rem}
    .genre-badge{font-size:.45rem;max-width:22%;padding:2px 6px} .fav-top-btn{font-size:.45rem;padding:2px 6px}
    .fab-main{width:42px;height:42px;font-size:1rem} .fab-sub-btn{padding:5px 10px;font-size:.55rem;min-width:100px}
    .search-input{width:50px;font-size:.45rem;padding-right:18px} .search-input:focus{width:85px}
    .top-bar{padding:4px 6px} .info-scroll{top:40px;padding:4px 10px} .info-scroll p{font-size:.7rem}
    .ctrl-btn{width:28px;height:28px;font-size:.65rem} .play-big{width:36px;height:36px;font-size:.9rem}
    .buttons-row{gap:8px} .teaching-bar{bottom:95px;font-size:.5rem;padding:5px 14px}
    .bottom-controls{padding:4px 8px 8px} .audio-status{font-size:.4rem;padding:1px 4px}
    .fab-container{bottom:80px;right:8px} .menu-button{width:24px;height:24px;font-size:.6rem}
    #tap-to-start{padding:10px 18px;font-size:.9rem;bottom:25%} .fav-modal{padding:20px;max-width:340px}
  }
</style>
</head>
<body>

<video id="bgVideo" class="bg" autoplay loop muted playsinline>
  <source src="mpb.mp4" type="video/mp4">
</video>

<div id="splash">
  <div class="splash-loading">
    <i class="fas fa-circle-notch fa-spin"></i>
    <p id="splashText">Carregando...</p>
  </div>
</div>

<div id="tap-to-start">▶ ATIVAR RÁDIO</div>

<div class="app" id="appContainer" style="display:none;">
  <div class="top-bar">
    <div class="genre-badge" id="genreBadge">🎸 Boleros</div>
    <div class="top-buttons">
      <span class="audio-status" id="audioStatus"><span class="dot"></span> Aguardando</span>
      <div class="search-wrapper">
        <input type="text" class="search-input" id="searchInput" placeholder="Buscar" autocomplete="off" autocorrect="off" spellcheck="false">
        <button class="clear-search" id="clearSearchBtn"><i class="fas fa-times"></i></button>
      </div>
      <button class="fav-top-btn" id="favTopBtn">
        <i class="fas fa-heart"></i> <span class="badge" id="favCount">0</span>
      </button>
      <div class="menu-button" id="menuButton"><i class="fas fa-ellipsis-v"></i></div>
    </div>
  </div>

  <div class="info-scroll"><p id="scrollText">🎵 RÁDIO PLAY 12 🎵</p></div>

  <div class="now-playing" id="nowPlaying">
    <div class="music-title" id="nowTitle">Carregando...</div>
    <div class="music-artist" id="nowArtist">Aguarde</div>
    <div class="fav-heart-center">
      <div class="fav-heart" id="heartBtn"><i class="far fa-heart"></i></div>
    </div>
    <div class="equalizer" id="equalizer">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <div class="teaching-bar">👆 Toque na tela para <span class="cyan">controles</span></div>
</div>

<div class="fav-modal" id="favModal">
  <button class="close-fav" id="closeFavModal"><i class="fas fa-times"></i></button>
  <h3><i class="fas fa-heart" style="color:#ff2d7f;"></i> Suas Favoritas</h3>
  <div class="fav-list" id="favList"><div class="fav-empty">Nenhuma música favorita</div></div>
  <button class="close-btn" id="closeFavBtn">FECHAR</button>
</div>

<div class="bottom-controls" id="bottomControls">
  <div class="progress-time"><span id="currentTime">0:00</span><span id="totalTime">0:00</span></div>
  <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="buttons-row">
    <button class="ctrl-btn" id="prevBtn"><i class="fas fa-backward-step"></i></button>
    <button class="ctrl-btn play-big" id="playBtn"><i class="fas fa-play"></i></button>
    <button class="ctrl-btn" id="nextBtn"><i class="fas fa-forward-step"></i></button>
    <button class="shuffle-btn" id="shuffleBtn"><i class="fas fa-random"></i></button>
  </div>
</div>

<div class="fab-container">
  <div class="fab-sub" id="fabSub">
    <button class="fab-sub-btn" id="fabVoltar"><i class="fas fa-arrow-left"></i> Voltar ao PLAY 12</button>
    <button class="fab-sub-btn" id="fabShare"><i class="fas fa-share-alt"></i> Compartilhar</button>
  </div>
  <div class="fab-main" id="fabMain"><i class="fas fa-plus"></i></div>
</div>

<div class="menu-popup" id="menuPopup">
  <button class="close-menu-btn" id="closeMenuBtn"><i class="fas fa-times"></i> Fechar</button>
  <button id="fullscreenMenuBtn"><i class="fas fa-expand"></i> Tela Cheia</button>
  <button id="reloadPlaylistBtn"><i class="fas fa-sync"></i> Recarregar Playlist</button>
  <button id="voltarMenuBtn"><i class="fas fa-arrow-left"></i> Voltar ao PLAY 12</button>
</div>

<div class="notification" id="notification">Mensagem</div>
<div id="loadingOverlay"><i class="fas fa-spinner fa-spin"></i></div>

<audio id="musicPlayer" preload="auto"></audio>
<audio id="backgroundAudio" preload="auto" style="display:none;"></audio>

<script>
/* ============================================================
   ⚙️  CONFIG  —  EDITE APENAS AQUI
   ============================================================ */
const CONFIG = {
  genero:      'Boleros',
  tituloApp:   'PLAY 12 • Boleros',
  corPrincipal:'#00ff88',

  jsonUrl:     'https://raw.githubusercontent.com/musicmpb-afk/mpba/refs/heads/main/bolerosbr.json',
  baseAudioUrl:'https://raw.githubusercontent.com/musicmpb-afk/mpba/refs/heads/main/',

  storageKey:  'radio_favorites_boleros',
  urlVoltar:   'https://radiolojasjc-hub.github.io/play12/'
};
/* ============================================================ */

(function () {
  'use strict';

  document.documentElement.style.setProperty('--cor', CONFIG.corPrincipal);
  document.getElementById('splashText').textContent = 'Carregando ' + CONFIG.genero + '...';

  /* ---------- Estado ---------- */
  let musicas = [];
  let filaReproducao = [];
  let indiceFila = 0;
  let musicaAtual = null;
  let isPlaying = false;
  let shuffleMode = false;
  let isBackgroundActive = false;
  let timerInterval = null;
  let favoritos = [];
  let fabOpen = false;
  let hideControlsTimeout = null;
  let carregandoMusica = false;
  let buscaTimeout = null;
  let ultimoIdTocado = null;

  /* ---------- Elementos ---------- */
  const $ = id => document.getElementById(id);
  const audio           = $('musicPlayer');
  const backgroundAudio = $('backgroundAudio');
  const playBtn         = $('playBtn');
  const progressFill    = $('progressFill');
  const currentTimeEl   = $('currentTime');
  const totalTimeEl     = $('totalTime');
  const genreBadge      = $('genreBadge');
  const scrollText      = $('scrollText');
  const splash          = $('splash');
  const tapToStart      = $('tap-to-start');
  const appContainer    = $('appContainer');
  const menuButton      = $('menuButton');
  const menuPopup       = $('menuPopup');
  const notification    = $('notification');
  const audioStatus     = $('audioStatus');
  const bottomControls  = $('bottomControls');
  const shuffleBtn      = $('shuffleBtn');
  const heartBtn        = $('heartBtn');
  const nowTitle        = $('nowTitle');
  const nowArtist       = $('nowArtist');
  const favCount        = $('favCount');
  const searchInput     = $('searchInput');
  const clearSearchBtn  = $('clearSearchBtn');
  const equalizer       = $('equalizer');
  const loadingOverlay  = $('loadingOverlay');

  genreBadge.textContent = '🎸 ' + CONFIG.genero;
  document.title = CONFIG.tituloApp;

  /* ---------- Utilitários ---------- */
  function showNotification(msg, d = 1500) {
    notification.textContent = msg;
    notification.classList.add('show');
    clearTimeout(notification._t);
    notification._t = setTimeout(() => notification.classList.remove('show'), d);
  }

  function formatTime(sec) {
    if (!sec || isNaN(sec) || !isFinite(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  function showLoading(show) { loadingOverlay.classList.toggle('active', !!show); }

  function showControls() {
    bottomControls.classList.add('visible');
    clearTimeout(hideControlsTimeout);
    hideControlsTimeout = setTimeout(() => bottomControls.classList.remove('visible'), 5000);
  }

  function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function goFullscreen() {
    try {
      const el = document.documentElement;
      (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen)?.call(el);
    } catch (_) {}
  }

  function voltarPlay12() { window.location.href = CONFIG.urlVoltar; }

  function gerarIdEstavel(m) {
    if (m.id && typeof m.id === 'string' && m.id.trim()) return m.id.trim();
    const base = `${m.artist || ''} - ${m.title || ''}`.trim().toLowerCase();
    return base.replace(/\s+/g, '_').replace(/[^\w-]/g, '') || `t_${Math.random().toString(36).slice(2, 8)}`;
  }

  /* ---------- URLs de áudio ---------- */
  function encodePath(nome) {
    return nome.split('/').map(encodeURIComponent).join('/');
  }

  function gerarUrlCompleta(nome) {
    if (!nome || !nome.trim()) return '';
    const s = nome.trim();
    if (/^https?:\/\//i.test(s)) return s;
    const limpo = s.replace(/^\.\//, '').replace(/^\/+/, '');
    if (!limpo) return '';
    const base = CONFIG.baseAudioUrl && !CONFIG.baseAudioUrl.endsWith('/')
      ? CONFIG.baseAudioUrl + '/'
      : CONFIG.baseAudioUrl;
    return base + encodePath(limpo);
  }

  function gerarUrlsAlternativas(musica) {
    const urls = new Set();
    const src = (musica.src || '').trim();
    if (src) {
      const u = gerarUrlCompleta(src);
      if (u) urls.add(u);
    }
    const base = src.replace(/\.[^.]+$/, '');
    const exts = ['mp3', 'm4a', 'ogg'];
    const variacoes = [
      base,
      base.replace(/ /g, '_'),
      base.replace(/ /g, '-')
    ];
    const titleClean = (musica.title || '').replace(/[^a-zA-Z0-9 ]/g, '').trim();
    if (titleClean.length > 2) variacoes.push(titleClean, titleClean.replace(/ /g, '_'), titleClean.replace(/ /g, '-'));
    const combo = `${musica.artist || ''} ${musica.title || ''}`.replace(/[^a-zA-Z0-9 ]/g, '').trim();
    if (combo.length > 3) variacoes.push(combo, combo.replace(/ /g, '_'), combo.replace(/ /g, '-'));

    variacoes.forEach(n => {
      if (!n || !n.trim()) return;
      exts.forEach(ext => {
        const url = gerarUrlCompleta(n.trim() + '.' + ext);
        if (url) urls.add(url);
      });
    });

    if (/\.m4a$/i.test(src)) urls.add(gerarUrlCompleta(src.replace(/\.m4a$/i, '.mp3')));
    if (/\.mp3$/i.test(src)) urls.add(gerarUrlCompleta(src.replace(/\.mp3$/i, '.m4a')));

    return Array.from(urls).filter(Boolean);
  }

  /* ---------- Favoritos ---------- */
  function salvarFavoritos() {
    try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(favoritos)); } catch (_) {}
  }

  function carregarFavoritos() {
    try {
      const raw = localStorage.getItem(CONFIG.storageKey);
      if (raw) favoritos = JSON.parse(raw) || [];
      if (!Array.isArray(favoritos)) favoritos = [];
    } catch (_) { favoritos = []; }
  }

  function updateFavCount() { favCount.textContent = favoritos.length; }

  function atualizarIconeCoracao() {
    const ativo = musicaAtual && favoritos.includes(musicaAtual.id);
    heartBtn.className = 'fav-heart' + (ativo ? ' active' : '');
    heartBtn.innerHTML = ativo ? '<i class="fas fa-heart"></i>' : '<i class="far fa-heart"></i>';
    updateFavCount();
  }

  function toggleFavorito(id) {
    if (!id) return;
    const idx = favoritos.indexOf(id);
    if (idx > -1) { favoritos.splice(idx, 1); showNotification('❤️ Removido', 1000); }
    else          { favoritos.push(id);       showNotification('❤️ Adicionado!', 1000); }
    salvarFavoritos();
    atualizarIconeCoracao();
    renderFavList();
  }

  function renderFavList() {
    const fl = $('favList');
    fl.innerHTML = '';
    if (favoritos.length === 0) {
      fl.innerHTML = '<div class="fav-empty">Nenhuma música favorita</div>';
      return;
    }
    const favs = favoritos.map(id => musicas.find(m => m.id === id)).filter(Boolean);
    if (favs.length === 0) {
      fl.innerHTML = '<div class="fav-empty">Favoritas não encontradas na playlist</div>';
      return;
    }
    favs.forEach(m => {
      const div = document.createElement('div');
      div.className = 'fav-item';
      div.innerHTML = `
        <div class="info" data-id="${m.id}">
          <div class="title"></div>
          <div class="artist"></div>
        </div>
        <button class="remove" data-id="${m.id}"><i class="fas fa-times-circle"></i></button>
      `;
      div.querySelector('.title').textContent = m.title;
      div.querySelector('.artist').textContent = m.artist;
      div.querySelector('.info').addEventListener('click', () => {
        playSongById(m.id);
        $('favModal').classList.remove('open');
      });
      div.querySelector('.remove').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFavorito(m.id);
      });
      fl.appendChild(div);
    });
  }

  function openFavModal() { renderFavList(); $('favModal').classList.add('open'); }

  /* ---------- Playlist ---------- */
  async function carregarPlaylist() {
    try {
      showLoading(true);
      const resp = await fetch(CONFIG.jsonUrl);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      let data = await resp.json();

      if (!Array.isArray(data)) {
        if (Array.isArray(data.musicas)) data = data.musicas;
        else if (Array.isArray(data.data)) data = data.data;
        else throw new Error('Formato de JSON inválido');
      }

      musicas = data
        .filter(m => m && (m.src || '').trim() && (m.title || '').trim())
        .map(m => ({ ...m, id: gerarIdEstavel(m), genero: CONFIG.genero }));

      showLoading(false);
      return true;
    } catch (error) {
      showLoading(false);
      showNotification(`❌ Erro: ${error.message}`, 2500);
      return false;
    }
  }

  /* ---------- Fila / navegação ---------- */
  function montarNovaFila(excluirId) {
    let lista = shuffleMode ? shuffleArray(musicas) : [...musicas];
    if (excluirId && lista.length > 1) {
      const idx = lista.findIndex(m => m.id === excluirId);
      if (idx > -1) { const [r] = lista.splice(idx, 1); lista.push(r); }
    }
    filaReproducao = lista;
    indiceFila = 0;
  }

  function proximaDaFila() {
    if (filaReproducao.length === 0) montarNovaFila(ultimoIdTocado);
    if (indiceFila >= filaReproducao.length) montarNovaFila(ultimoIdTocado);
    return filaReproducao[indiceFila++] || null;
  }

  function updateNowPlaying(t) {
    if (!t) return;
    musicaAtual = t;
    nowTitle.textContent = t.title;
    nowArtist.textContent = t.artist;
    scrollText.textContent = `🎵 ${t.title} - ${t.artist} [${CONFIG.genero}] 🎵`;
    atualizarIconeCoracao();
    equalizer.querySelectorAll('span').forEach(el => {
      el.style.background = `linear-gradient(180deg, ${CONFIG.corPrincipal}, ${CONFIG.corPrincipal}88)`;
    });
  }

  /* ---------- Reprodução ---------- */
  function tocarMusica(track) {
    return new Promise((resolve) => {
      if (!track) { resolve(false); return; }
      const urls = gerarUrlsAlternativas(track);
      if (urls.length === 0) { showNotification('❌ Sem URL', 1000); resolve(false); return; }

      let i = 0;
      let finalizado = false;

      const tentar = () => {
        if (i >= urls.length) {
          if (!finalizado) { finalizado = true; resolve(false); }
          return;
        }
        const url = urls[i];
        let timeoutId = null;

        const onCanPlay = () => {
          clearTimeout(timeoutId);
          audio.removeEventListener('canplay', onCanPlay);
          audio.removeEventListener('error', onError);
          audio.play().then(() => {
            if (finalizado) return;
            finalizado = true;
            isPlaying = true;
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            equalizer.classList.remove('paused');
            startTimer();
            carregandoMusica = false;
            if (!/^https?:\/\//i.test(track.src || '')) track.src = url;
            resolve(true);
          }).catch(() => { i++; tentar(); });
        };
        const onError = () => {
          clearTimeout(timeoutId);
          audio.removeEventListener('canplay', onCanPlay);
          audio.removeEventListener('error', onError);
          i++; tentar();
        };

        audio.addEventListener('canplay', onCanPlay, { once: true });
        audio.addEventListener('error', onError, { once: true });
        timeoutId = setTimeout(() => { if (!finalizado) { i++; tentar(); } }, 6000);
        audio.src = url;
        audio.load();
      };
      tentar();
    });
  }

  async function playMusic() {
    if (carregandoMusica) return;
    if (!isBackgroundActive) { showNotification('⚠️ Ative o áudio primeiro!', 1200); return; }
    if (musicas.length === 0) { showNotification('Playlist vazia!', 1500); return; }

    carregandoMusica = true;
    const track = proximaDaFila();
    if (!track) { carregandoMusica = false; return; }

    ultimoIdTocado = track.id;
    updateNowPlaying(track);

    const ok = await tocarMusica(track);
    if (!ok) {
      showNotification('⏭️ Pulando...', 1200);
      carregandoMusica = false;
      setTimeout(playMusic, 300);
    }
  }

  function nextTrack() {
    if (carregandoMusica || musicas.length === 0) return;
    if (isPlaying) playMusic();
    else {
      const t = proximaDaFila();
      if (t) {
        ultimoIdTocado = t.id;
        updateNowPlaying(t);
        const url = gerarUrlsAlternativas(t)[0];
        if (url) { audio.src = url; audio.load(); }
      }
    }
    showControls();
  }

  function prevTrack() {
    if (carregandoMusica || musicas.length === 0) return;
    indiceFila = Math.max(0, indiceFila - 2);
    const t = filaReproducao[indiceFila] || filaReproducao[0];
    indiceFila++;
    if (!t) return;
    ultimoIdTocado = t.id;
    updateNowPlaying(t);
    const url = gerarUrlsAlternativas(t)[0];
    if (url) { audio.src = url; audio.load(); if (isPlaying) audio.play().catch(() => {}); }
    showControls();
  }

  function togglePlay() {
    if (!isBackgroundActive) { showNotification('Clique em ATIVAR RÁDIO!', 1200); return; }
    if (audio.paused) playMusic();
    else audio.pause();
    showControls();
  }

  function toggleShuffle() {
    shuffleMode = !shuffleMode;
    shuffleBtn.classList.toggle('active', shuffleMode);
    showNotification(shuffleMode ? '🔀 Aleatório ON' : '➡️ Sequencial', 800);
    showControls();
  }

  function startTimer() {
    stopTimer();
    timerInterval = setInterval(() => {
      if (audio.duration && isFinite(audio.duration)) {
        progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
        currentTimeEl.textContent = formatTime(audio.currentTime);
        totalTimeEl.textContent  = formatTime(audio.duration);
      }
    }, 250);
  }
  function stopTimer() { if (timerInterval) clearInterval(timerInterval); timerInterval = null; }

  function playSongById(id) {
    if (carregandoMusica) return;
    const m = musicas.find(x => x.id === id);
    if (!m) { showNotification('Música não encontrada', 1000); return; }
    audio.pause();
    audio.src = '';
    audio.load();

    const resto = shuffleArray(musicas.filter(x => x.id !== id));
    filaReproducao = [m, ...resto];
    indiceFila = 1;
    ultimoIdTocado = m.id;
    updateNowPlaying(m);

    if (isBackgroundActive) setTimeout(playMusic, 150);
    showNotification(`🎵 ${m.title}`, 1500);
  }

  function buscarMusica(termo) {
    if (!termo || termo.length < 2) { showNotification('📋 Digite 2+ caracteres', 1000); return; }
    const tl = termo.toLowerCase().trim();
    const res = musicas.filter(m =>
      m.title.toLowerCase().includes(tl) || m.artist.toLowerCase().includes(tl)
    );
    if (res.length === 0) { showNotification('🔍 Nenhuma encontrada', 1500); return; }
    filaReproducao = shuffleMode ? shuffleArray(res) : [...res];
    indiceFila = 0;
    genreBadge.textContent = `🔍 ${res.length}`;
    if (isBackgroundActive) playMusic();
    showNotification(`🔍 ${res.length} resultado(s)`, 1200);
  }

  /* ---------- Ativação do áudio ---------- */
  function criarAudioSilencioso() {
    try {
      const sr = 8000, dur = 0.5, n = Math.floor(sr * dur);
      const buf = new ArrayBuffer(44 + n * 2);
      const dv = new DataView(buf);
      const w = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
      w(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
      dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
      dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true); dv.setUint16(32, 2, true);
      dv.setUint16(34, 16, true); w(36, 'data'); dv.setUint32(40, n * 2, true);
      return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
    } catch (_) { return ''; }
  }

  async function ativarAudio() {
    try {
      showLoading(true);
      const url = criarAudioSilencioso();
      if (url) {
        backgroundAudio.src = url;
        backgroundAudio.loop = true;
        backgroundAudio.volume = 0.01;
        await backgroundAudio.play().catch(() => {});
      }
      isBackgroundActive = true;
      audioStatus.classList.add('active');
      audioStatus.innerHTML = '<span class="dot"></span> Ativado';
      if ('wakeLock' in navigator) { try { await navigator.wakeLock.request('screen'); } catch (_) {} }
      await playMusic();
    } catch (_) {
      isBackgroundActive = true;
      audioStatus.classList.add('active');
      audioStatus.innerHTML = '<span class="dot"></span> Ativado';
      await playMusic();
    } finally {
      showLoading(false);
    }
  }

  /* ---------- Eventos de áudio ---------- */
  audio.addEventListener('play', () => {
    isPlaying = true;
    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
    equalizer.classList.remove('paused');
    startTimer();
  });
  audio.addEventListener('pause', () => {
    isPlaying = false;
    playBtn.innerHTML = '<i class="fas fa-play"></i>';
    equalizer.classList.add('paused');
    stopTimer();
  });
  audio.addEventListener('ended', () => { if (!carregandoMusica) nextTrack(); });

  /* ---------- UI / Botões ---------- */
  playBtn.addEventListener('click', togglePlay);
  $('nextBtn').addEventListener('click', nextTrack);
  $('prevBtn').addEventListener('click', prevTrack);
  shuffleBtn.addEventListener('click', toggleShuffle);

  heartBtn.addEventListener('click', () => {
    if (musicaAtual) toggleFavorito(musicaAtual.id);
  });

  $('favTopBtn').addEventListener('click', openFavModal);
  $('closeFavModal').addEventListener('click', () => $('favModal').classList.remove('open'));
  $('closeFavBtn').addEventListener('click', () => $('favModal').classList.remove('open'));
  $('favModal').addEventListener('click', (e) => {
    if (e.target === $('favModal')) $('favModal').classList.remove('open');
  });

  const fabMain = $('fabMain'), fabSub = $('fabSub');
  fabMain.addEventListener('click', () => {
    fabOpen = !fabOpen;
    fabSub.classList.toggle('open', fabOpen);
    fabMain.innerHTML = fabOpen ? '<i class="fas fa-times"></i>' : '<i class="fas fa-plus"></i>';
  });
  $('fabVoltar').addEventListener('click', voltarPlay12);
  $('voltarMenuBtn').addEventListener('click', voltarPlay12);
  $('fabShare').addEventListener('click', async () => {
    if (!musicaAtual) { showNotification('Nenhuma música tocando', 1000); return; }
    const msg = `🎵 Ouvindo "${musicaAtual.title}" - ${musicaAtual.artist} no PLAY 12 ${CONFIG.genero}!`;
    try {
      if (navigator.share) await navigator.share({ title: CONFIG.tituloApp, text: msg, url: location.href });
      else { await navigator.clipboard.writeText(msg + ' ' + location.href); showNotification('📋 Copiado!', 2000); }
    } catch (_) { showNotification('Compartilhamento indisponível', 1200); }
    fabMain.click();
  });

  menuButton.addEventListener('click', (e) => {
    e.stopPropagation();
    menuPopup.classList.toggle('open');
    showControls();
  });
  $('closeMenuBtn').addEventListener('click', () => menuPopup.classList.remove('open'));
  $('fullscreenMenuBtn').addEventListener('click', () => { menuPopup.classList.remove('open'); goFullscreen(); });
  $('reloadPlaylistBtn').addEventListener('click', async () => {
    menuPopup.classList.remove('open');
    showNotification('🔄 Recarregando...', 1000);
    await carregarPlaylist();
    montarNovaFila(null);
    showNotification(`✅ Playlist: ${musicas.length} músicas`, 1800);
  });

  $('progressBar').addEventListener('click', (e) => {
    if (audio.duration && isFinite(audio.duration)) {
      const rect = e.currentTarget.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
      showControls();
    }
  });

  searchInput.addEventListener('input', (e) => {
    const termo = e.target.value.trim();
    clearSearchBtn.style.display = termo ? 'block' : 'none';
    clearTimeout(buscaTimeout);
    buscaTimeout = setTimeout(() => {
      if (termo === '') {
        genreBadge.textContent = '🎸 ' + CONFIG.genero;
        montarNovaFila(null);
        if (isBackgroundActive) playMusic();
        showNotification('📋 Playlist restaurada', 800);
        return;
      }
      buscarMusica(termo);
    }, 400);
  });
  clearSearchBtn.addEventListener('click', () => {
    searchInput.value = '';
    clearSearchBtn.style.display = 'none';
    genreBadge.textContent = '🎸 ' + CONFIG.genero;
    montarNovaFila(null);
    searchInput.focus();
  });

  document.addEventListener('click', (e) => {
    if (menuPopup.classList.contains('open') && !menuPopup.contains(e.target) && e.target !== menuButton) {
      menuPopup.classList.remove('open');
    }
    showControls();
  });

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    switch (e.key) {
      case ' ': e.preventDefault(); togglePlay(); break;
      case 'ArrowRight': nextTrack(); break;
      case 'ArrowLeft': prevTrack(); break;
      case 's': case 'S': toggleShuffle(); break;
      case 'f': case 'F': if (musicaAtual) toggleFavorito(musicaAtual.id); break;
    }
  });

  let lastTap = 0;
  $('nowPlaying').addEventListener('click', () => {
    const now = Date.now();
    if (now - lastTap < 300 && now - lastTap > 50 && musicaAtual) toggleFavorito(musicaAtual.id);
    lastTap = now;
    showControls();
  });

  tapToStart.addEventListener('click', async () => {
    showNotification('🔊 Ativando áudio...', 1000);
    await ativarAudio();
    tapToStart.style.display = 'none';
    goFullscreen();
  });

  /* ---------- Inicialização ---------- */
  async function iniciar() {
    try {
      carregarFavoritos();
      updateFavCount();
      renderFavList();

      const ok = await carregarPlaylist();
      if (!ok || musicas.length === 0) {
        splash.innerHTML = `
          <div class="splash-loading">
            <i class="fas fa-exclamation-triangle"></i>
            <p>Nenhuma música carregada</p>
            <button onclick="location.reload()" style="margin-top:10px;padding:8px 20px;border-radius:20px;border:none;background:${CONFIG.corPrincipal};color:#000;font-weight:bold;cursor:pointer;">Recarregar</button>
          </div>`;
        return;
      }

      montarNovaFila(null);
      if (filaReproducao[0]) updateNowPlaying(filaReproducao[0]);

      setTimeout(() => {
        splash.classList.add('hidden');
        setTimeout(() => {
          splash.style.display = 'none';
          appContainer.style.display = 'block';
          tapToStart.style.display = 'block';
          goFullscreen();
        }, 500);
      }, 400);
    } catch (err) {
      splash.innerHTML = `
        <div class="splash-loading">
          <i class="fas fa-exclamation-triangle"></i>
          <p>Erro: ${err.message}</p>
          <button onclick="location.reload()" style="margin-top:10px;padding:8px 20px;border-radius:20px;border:none;background:${CONFIG.corPrincipal};color:#000;font-weight:bold;cursor:pointer;">Recarregar</button>
        </div>`;
    }
  }

  window.addEventListener('load', iniciar);
})();
</script>
</body>
